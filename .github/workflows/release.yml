name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-source:
    name: Verify tag belongs to main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the SemVer tag declared by CMake
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH SemVer."
            exit 1
          fi
          project_version="$(sed -nE 's/^project\(FourWindsReborn VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' CMakeLists.txt)"
          if [[ -z "$project_version" || "v$project_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMake project version ${project_version:-<missing>}."
            exit 1
          fi

      - name: Require the tagged commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to commits already present on origin/main."
            exit 1
          fi

  validate-data:
    name: Validate theme JSON
    needs: verify-release-source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source and engine
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate JSON
        run: python scripts/validate-json.py

  build-unix:
    name: Build ${{ matrix.label }} release
    needs: verify-release-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux
            script: linux
            package: linux-x64
          - runner: macos-15-intel
            label: macOS
            script: macos
            package: macos-x64
    steps:
      - name: Check out tagged source and engine
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config sdl2 sdl2_image sdl2_mixer sdl2_ttf zlib

      - name: Build and test Release
        shell: bash
        run: ./scripts/build-${{ matrix.script }}.sh --clean

      - name: Package Release
        shell: bash
        run: |
          bundle="four-winds-reborn-${GITHUB_REF_NAME}-${{ matrix.package }}"
          mkdir -p "release/${bundle}"
          cp four-winds-reborn README.md CHANGELOG.md LICENSE "release/${bundle}/"
          cp -R themes "release/${bundle}/"
          tar -czf "release/${bundle}.tar.gz" -C release "${bundle}"

      - name: Upload Release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.package }}
          path: release/*.tar.gz
          retention-days: 7

  build-windows:
    name: Build Windows UCRT64 release
    needs: verify-release-source
    runs-on: windows-2022
    steps:
      - name: Check out tagged source and engine
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-zlib

      - name: Build and test Release
        shell: msys2 {0}
        run: ./scripts/build-windows-msys2.sh --clean --release-gui

      - name: Verify player build has no console subsystem
        shell: msys2 {0}
        run: objdump -p dist/windows/four-winds-reborn.exe | grep -q "Windows GUI"

      - name: Package Windows Release
        shell: pwsh
        run: |
          $bundle = "four-winds-reborn-$env:GITHUB_REF_NAME-windows-x64"
          $bundleRoot = Join-Path release $bundle
          New-Item -ItemType Directory -Force $bundleRoot | Out-Null
          Copy-Item dist/windows/* $bundleRoot -Recurse
          Copy-Item README.md, CHANGELOG.md, LICENSE $bundleRoot
          Compress-Archive -Path $bundleRoot -DestinationPath "release/$bundle.zip"

      - name: Upload Windows Release package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release/*.zip
          retention-days: 7

  build-android:
    name: Build Android arm64 APK
    needs: verify-release-source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source and engine
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android components
        shell: bash
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-35"
          "build-tools;35.0.0"
          "cmake;3.22.1"
          "ndk;27.2.12479018"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Fetch and verify pinned SDL sources
        shell: pwsh
        run: ./scripts/fetch-android-dependencies.ps1

      - name: Build and lint installable APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle --project-dir android --stacktrace \
            -PfourWindsVersionName="$version" \
            :app:lintDebug :app:assembleDebug

      - name: Verify and package Android release
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          version="${GITHUB_REF_NAME#v}"
          "$aapt" dump badging "$apk" | grep -q "package: name='com.jaskes.fourwindsreborn' versionCode='400' versionName='$version'"
          "$aapt" dump badging "$apk" | grep -q "native-code: 'arm64-v8a'"
          unzip -Z1 "$apk" > android-apk-contents.txt
          for library in SDL2 SDL2_image SDL2_mixer SDL2_ttf main; do
            grep -qx "lib/arm64-v8a/lib${library}.so" android-apk-contents.txt
          done
          grep -qx "lib/arm64-v8a/libc++_shared.so" android-apk-contents.txt
          grep -qx "assets/assets.list" android-apk-contents.txt
          grep -q '^assets/themes/classic/' android-apk-contents.txt
          grep -q '^assets/themes/reborn/' android-apk-contents.txt
          mkdir -p release
          cp "$apk" "release/four-winds-reborn-${GITHUB_REF_NAME}-android-arm64.apk"

      - name: Upload Android release package
        uses: actions/upload-artifact@v7
        with:
          name: release-android-arm64
          path: release/*.apk
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - validate-data
      - build-unix
      - build-windows
      - build-android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum *.apk *.tar.gz *.zip > SHA256SUMS.txt

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-artifacts/*
          --verify-tag
          --generate-notes
          --title "Four Winds Reborn $GITHUB_REF_NAME"
